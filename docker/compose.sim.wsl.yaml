# WSL2 GPU access for the verified OGRE2/EGL capture and matrix environment.
# Combine with compose.sim.yaml; this file is not used by production.
services:
  simulation:
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib:/opt/ros/jazzy/lib
      GALLIUM_DRIVER: d3d12
      MESA_D3D12_DEFAULT_ADAPTER_NAME: "${SIM_GPU_ADAPTER:-NVIDIA}"
