name: greenhouse-sim

services:
  production:
    image: greenhouse-jazzy:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: production-runtime
      network: host
      args:
        BUILD_JOBS: "${BUILD_JOBS:-2}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
      additional_contexts:
        robot_source: ../src
        dependencies: ../third_party
        build_tools: ../tools

  simulation:
    image: greenhouse-sim:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.sim
      network: host
      additional_contexts:
        production: service:production
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${SIM_ROS_DOMAIN_ID:-42}"
    command: [ros2, launch, greenhouse_nav2_bringup, simulation.launch.py, "world:=${SIM_WORLD:-empty.sdf}", "vehicle:=${SIM_VEHICLE:-false}"]
