# Clearpath A200 simulation command limits and watchdog timings.
greenhouse_cmd_gate:
  ros__parameters:
    source_topic: /cmd_vel/test
    output_topic: /cmd_vel
    output_frame: base_link
    publish_rate_hz: 50.0
    max_linear_velocity: 1.0
    max_angular_velocity: 1.0
    max_linear_acceleration: 1.0
    max_angular_acceleration: 1.0
    watchdog_timeout_sec: 0.5
    max_command_age_sec: 0.2
    future_tolerance_sec: 0.05
    auto_recover_after_watchdog: false

greenhouse_sim_cmd_sink:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /platform/cmd_vel
