# Simulation command limits and watchdog timings.
# The gate reads the navigation command topic so the closed-loop navigation
# entry owns the only command source; qualification_scope is a required
# parameter and marks these limits as simulation-only.
greenhouse_cmd_gate:
  ros__parameters:
    source_topic: /cmd_vel/nav
    output_topic: /cmd_vel
    output_frame: base_link
    qualification_scope: greenhouse_simulation_matrix_only
    publish_rate_hz: 50.0
    max_linear_velocity: 1.0
    max_angular_velocity: 1.0
    max_linear_acceleration: 1.0
    max_angular_acceleration: 1.0
    watchdog_timeout_sec: 0.5
    max_command_age_sec: 0.2
    future_tolerance_sec: 0.05
    auto_recover_after_watchdog: false

greenhouse_sim_cmd_sink:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /platform/cmd_vel
