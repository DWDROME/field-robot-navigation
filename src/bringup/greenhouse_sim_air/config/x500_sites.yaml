# X500 inspection waypoints per site, in the PX4 local NED frame
# (x north, y east, z up expressed as positive altitude; converted to NED
# by the mission node). Origin is the vehicle spawn pose from
# simulation_x500.launch.py. Altitudes are relative to the settled PX4 home,
# not continuously adjusted AGL. The geometry report checks the complete route
# and takeoff/landing column before flight. Flown as a real offboard
# waypoint inspection; not a terrain-following or obstacle-avoidance demo.
maize_field:
  spawn: [-9.0, -8.5, 0.35, 0.0]
  cruise_altitude: 3.0
  clearance_note: "Headland corner; route clearance must pass inspect-simulation-geometry.py"
  waypoints:
    - {x: 2.0, y: 2.0, z: 3.0}
    - {x: 8.0, y: 2.0, z: 3.0}
    - {x: 8.0, y: 8.0, z: 3.0}
    - {x: 2.0, y: 8.0, z: 3.0}
orchard:
  spawn: [-3.0, -3.0, 0.15, 0.0]
  cruise_altitude: 6.0
  clearance_note: "Open gap between tree rows; complete takeoff column and canopy checked from collision meshes"
  waypoints:
    - {x: 6.0, y: 0.0, z: 6.0}
    - {x: 12.0, y: 0.0, z: 6.0}
    - {x: 12.0, y: 6.0, z: 6.0}
    - {x: 6.0, y: 6.0, z: 6.0}
pipeline:
  spawn: [-3.0, 3.0, 0.1, 0.0]
  cruise_altitude: 10.0
  clearance_note: "Measured flat staging patch away from base station; 0.030 m footprint height range, complete route and home column checked against collision meshes"
  waypoints:
    - {x: 0.0, y: 8.0, z: 10.0}
    - {x: 10.0, y: 8.0, z: 10.0}
    - {x: 10.0, y: 0.0, z: 10.0}
    - {x: 0.0, y: 0.0, z: 10.0}
